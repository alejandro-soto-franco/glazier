[package]
name = "glazier-cpm"
description = "Cellular Potts tissue simulation on the CPU and the GPU"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"


[features]
default = []
cuda = ["dep:glazier-cuda"]

[dependencies]
glazier-core.workspace = true
glazier-cuda = { workspace = true, optional = true }
serde_json.workspace = true

# The crates.io name `glazier` belongs to an unrelated crate, so the package
# takes the suffix and the library and the binary keep the plain name: a
# dependant still writes `use glazier::...` and still runs `glazier`.
[lib]
name = "glazier"
path = "src/lib.rs"

[[bin]]
name = "glazier"
path = "src/main.rs"
