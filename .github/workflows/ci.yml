name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "figures/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      # The runners have no GPU, so the device sweep is compiled rather than
      # run: `cargo check` on the cuda feature keeps that path honest, and
      # cudarc dlopens the driver so it needs no toolchain here.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: check the device sweep
        run: cargo check -p glazier-cpm --features cuda

      - name: test
        run: cargo test --workspace

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.90

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: install
        run: |
          python -m pip install --upgrade pip maturin pytest numpy scipy polars tifffile
          python -m pip install . --no-build-isolation

      # The binary backs one half of the conformance test, which compares what
      # the compiled module read against what the binary printed.
      - name: build the binary
        run: cargo build --release -p glazier-cpm

      - name: pytest
        run: python -m pytest tests -q
