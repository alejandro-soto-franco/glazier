[package]
name = "glazier-py"
description = "Python bindings for the glazier cellular Potts engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
# The wheel goes to PyPI; there is nothing here a crates.io consumer would use.
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
default = []
cuda = ["glazier/cuda"]

[dependencies]
glazier = { path = "../glazier", version = "0.1.3", package = "glazier-cpm" }
glazier-core.workspace = true
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
